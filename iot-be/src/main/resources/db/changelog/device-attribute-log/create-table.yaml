databaseChangeLog:
  - changeSet:
      id: create-table
      author: thalabi
      changes:
        - createTable:
            tableName: device_attribute_log
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: lk, type: varchar(4000), constraints: {nullable: false}}
              - column: {name: version, type: bigint, constraints: {nullable: false}}

              - column: {name: timestamp, type: timestamp with time zone, constraints: {nullable: false}}
              - column: {name: changes, type: jsonb, constraints: {nullable: false}}

              - column: {name: device_id, type: bigint, constraints: {nullable: false, references: device(id), foreignKeyName: fk_device_attribute_log_1}}
              
              
  - changeSet:
      id: add-unique-constraint-lk
      author: thalabi
      changes:
        - addUniqueConstraint:
            tableName: device_attribute_log
            columnNames: lk
            constraintName: device_attribute_log_lk_unique                            