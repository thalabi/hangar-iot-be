databaseChangeLog:
  - changeSet:
      id: create-table
      author: thalabi
      changes:
        - createTable:
            tableName: zone
            columns:
              - column: {name: id, type: bigint, autoIncrement: true, constraints: {primaryKey: true}}
              - column: {name: lk, type: VARCHAR(4000), constraints: {nullable: false}}
              - column: {name: version, type: bigint, constraints: {nullable: false}}
              
              - column: {name: name, type: varchar(255), constraints: {nullable: false}}
              - column: {name: latitude_degrees, type: "decimal(10,7)", constraints: {nullable: false}}
              - column: {name: longitude_degrees, type: "decimal(10,7)", constraints: {nullable: false}}
              - column: {name: timezone_offset, type: integer, constraints: {nullable: false}}
              - column: {name: time_dst, type: varchar(255), constraints: {nullable: false}}
              - column: {name: time_std, type: varchar(255), constraints: {nullable: false}}
              
              
  - changeSet:
      id: add-unique-constraint-lk
      author: thalabi
      changes:
        - addUniqueConstraint:
            tableName: zone
            columnNames: lk
            constraintName: zone_lk_unique                            